# =============================================================================
#  LLM 路由中转系统（llmbridge）· 裸机（systemd）部署的 Nginx 站点配置
# =============================================================================
#
#  这是**模板**。deploy/install.sh 会把下面的占位符替换成实际值，
#  输出到 <安装目录>/deploy/nginx-llmbridge.conf，然后这样启用：
#
#    sudo cp <安装目录>/deploy/nginx-llmbridge.conf /etc/nginx/conf.d/llmbridge.conf
#    sudo nginx -t && sudo systemctl reload nginx
#
#  占位符：
#    __API_PORT__     后端监听端口（install.sh 的 --port）
#    __LISTEN_PORT__  Nginx 对外端口（默认 80）
#    __DIST_DIR__     控制台前端构建产物目录（admin-web/dist 的绝对路径）
#
#  为什么裸机部署也需要这一层：
#    后端（llmbridge-serve）只提供 /v1 与 /admin 两套**接口**，不托管前端静态文件。
#    控制台是一个独立的 Vue SPA，必须有 web 服务器托管它的构建产物并做 history 回落。
#    Docker Compose 形态里这个角色由 nginx 容器担任，裸机形态就用系统 nginx。
# =============================================================================

upstream llmbridge_api {
    server 127.0.0.1:__API_PORT__;
    keepalive 32;
}

server {
    listen __LISTEN_PORT__;
    server_name _;

    root __DIST_DIR__;
    index index.html;

    # 长 prompt / 大模型请求体给足空间，默认 1m 会在长上下文时 413。
    client_max_body_size 16m;

    # 不要在这里开全局 `add_header X-Frame-Options` 之类：
    # nginx 的继承规则是「子级出现 add_header 就完全覆盖父级」，
    # 容易导致 /v1 反而丢头。

    # ---------- 控制台前端（Vue SPA）----------
    # history 模式路由：/logs、/usage 这类路径在磁盘上不存在，
    # 必须回落 index.html，否则刷新页面直接 404。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 带内容哈希的静态资源可以长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ---------- 对外 OpenAI 兼容入口（含 SSE 流式）----------
    location /v1/ {
        proxy_pass http://llmbridge_api;
        proxy_http_version 1.1;

        # ↓↓↓ SSE 四件套：缺任何一条都会让流式体验退化 ↓↓↓
        proxy_buffering off;        # 不缓冲：否则整段回答被攒着一次性发出
        proxy_cache off;            # 不缓存：LLM 响应不可复用，且会破坏流式
        proxy_set_header Connection "";   # 配合 http_version 1.1 复用 upstream 长连接
        proxy_read_timeout 300s;    # 长回答不能按默认 60s 掐断
        # ↑↑↑ ---------------------------------------- ↑↑↑

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 告诉客户端与任何上游代理：本响应不可缓冲。
        add_header X-Accel-Buffering no always;

        # 非流式的 JSON 响应也不要重写 body（保持字节级透传）。
        proxy_set_header Accept-Encoding "";
    }

    # ---------- 对内控制台接口 ----------
    # /admin 下都是普通 JSON 与短连接，**刻意不关 buffering**：
    # 这里关掉只会白白降低吞吐，没有流式需求。
    location /admin/ {
        proxy_pass http://llmbridge_api;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        # 试跑台会真实调用下游大模型，走同步执行，给足超时。
        proxy_send_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 存活探针（容器/负载均衡/监控用）
    location = /health {
        proxy_pass http://llmbridge_api;
        access_log off;
    }

    # ---------- 可选：HTTPS ----------
    # 生产务必启用，并在 80 → 443 做 301 跳转。
    # SSE 在 HTTPS 下同样依赖上面的 proxy_buffering off，与协议无关。
    #
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
}
