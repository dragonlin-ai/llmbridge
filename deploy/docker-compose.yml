# LLM 路由中转系统 · Docker Compose 编排（生产推荐形态）
#
# 用法（在仓库根目录执行）：
#   cp .env.example .env          # 然后改 JWT_SECRET / ENCRYPTION_MASTER_KEY / POSTGRES_PASSWORD
#   cd admin-web && npm ci && npm run build && cd ..   # nginx 要挂 dist/
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 注意 `--build`：前端产物 dist/ 是 bind mount 进 nginx 的，
# 改了前端必须重新 build，重启容器不会生效。

name: llmbridge

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: llmbridge-api:1.0.0
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # compose 内网用服务名 `db` 互访；这里覆盖 .env 里的 127.0.0.1。
      # 驱动固定 psycopg3 —— 写成 asyncpg 会因为依赖未安装而启动即失败。
      DATABASE_URL: postgresql+psycopg://llmbridge:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}@db:5432/llmbridge
      LLMBRIDGE_REPO_ROOT: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks: [llmbridge]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置}
      POSTGRES_DB: llmbridge
      # 中文环境常踩：容器默认 C locale，中文排序/比较会不合预期。
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmbridge -d llmbridge"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [llmbridge]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [llmbridge]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端为纯静态产物，直接挂载，无需打进镜像。
      - ../admin-web/dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_started
    networks: [llmbridge]

volumes:
  pgdata: {}
  redisdata: {}

networks:
  llmbridge:
    driver: bridge
