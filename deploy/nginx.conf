# LLM 路由中转系统 · Nginx 反向代理
# 挂载位置：/etc/nginx/conf.d/default.conf
#
# ⚠️ 本文件里最不能删的是 `proxy_buffering off`。
#    开着它，SSE 会被 nginx 缓冲到整段响应结束才吐给浏览器 ——
#    现象是「流式回答一直转圈、最后一次性刷出来」，而 curl 直打 8000 完全正常。
#    本项目历史故障里，这一条占了绝大多数（部署文档 §七 有记）。

upstream llmbridge_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 长 prompt / 大模型请求体给足空间，默认 1m 会在长上下文时 413。
    client_max_body_size 16m;

    # 不要在这里开 `add_header X-Frame-Options` 之类的全局安全头：
    # 本 server 块内多个 location 各自有 add_header，nginx 的继承规则是
    # 「子级出现 add_header 就完全覆盖父级」，容易导致 /v1 反而丢头。

    # ---------- 控制台前端（Vue SPA）----------
    # history 模式路由：/logs、/usage 这类路径在磁盘上不存在，
    # 必须回落 index.html，否则刷新页面直接 404。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 带内容哈希的静态资源可以长期缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ---------- 对外 OpenAI 兼容入口（含 SSE 流式）----------
    location /v1/ {
        proxy_pass http://llmbridge_api;
        proxy_http_version 1.1;

        # ↓↓↓ SSE 四件套：缺任何一条都会让流式体验退化 ↓↓↓
        proxy_buffering off;        # 不缓冲：否则整段回答被攒着一次性发出
        proxy_cache off;            # 不缓存：LLM 响应不可复用，且会破坏流式
        proxy_set_header Connection "";   # 配合 http_version 1.1 复用 upstream 长连接
        proxy_read_timeout 300s;    # 长回答不能按默认 60s 掐断
        # ↑↑↑ ---------------------------------------- ↑↑↑

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 告诉客户端与任何上游代理：本响应不可缓冲。
        # 有的部署前面还架了一层网关，只有 proxy_buffering off 不够。
        add_header X-Accel-Buffering no always;

        # 非流式的 JSON 响应也不要重写 body（保持字节级透传）。
        proxy_set_header Accept-Encoding "";
    }

    # ---------- 对内控制台接口 ----------
    # /admin 下都是普通 JSON 与短连接，**刻意不关 buffering**：
    # 这里关掉只会白白降低吞吐，没有流式需求。
    location /admin/ {
        proxy_pass http://llmbridge_api;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        # 试跑台会真实调用下游大模型，走的是同步执行，给足超时。
        proxy_send_timeout 120s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 存活探针（容器/负载均衡用）
    location = /health {
        proxy_pass http://llmbridge_api;
        access_log off;
    }

    # ---------- 可选：HTTPS ----------
    # 生产务必启用，并在 80 → 443 做 301 跳转。
    # 注意 SSE 在 HTTPS 下同样依赖上面的 proxy_buffering off，与协议无关。
    #
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
}
